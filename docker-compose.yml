services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: notebook-postgres

    environment:
      POSTGRES_DB: notebook
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - notebook_pg_data:/var/lib/postgresql/data
      # - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebook"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notebook_pg_data: